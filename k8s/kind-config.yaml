kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
    - role: control-plane
      extraPortMappings:
          - containerPort: 30777
            hostPort: 7777
    - role: worker
      kubeadmConfigPatches:
          - |
              kind: JoinConfiguration
              nodeRegistration:
                  kubeletExtraArgs:
                      node-labels: "auction/bidder=alice"
    - role: worker
      kubeadmConfigPatches:
          - |
              kind: JoinConfiguration
              nodeRegistration:
                  kubeletExtraArgs:
                      node-labels: "auction/bidder=bob"
    - role: worker
      kubeadmConfigPatches:
          - |
              kind: JoinConfiguration
              nodeRegistration:
                  kubeletExtraArgs:
                      node-labels: "auction/bidder=carol"