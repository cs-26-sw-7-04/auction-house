# k8s/k3d-config.yaml
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
    name: auction
servers: 1
agents: 5
ports:
    - port: 7777:30777
      nodeFilters:
          - server:0
options:
    k3s:
        extraArgs:
            - arg: --disable=traefik
              nodeFilters:
                  - server:0
            - arg: --kubelet-arg=fail-cgroupv1=false
              nodeFilters:
                  - server:*
                  - agent:*
        nodeLabels:
            - label: auction/bidder=alice
              nodeFilters:
                  - agent:0
            - label: auction/bidder=bob
              nodeFilters:
                  - agent:1
            - label: auction/bidder=carol
              nodeFilters:
                  - agent:2
            - label: auction/bidder=dave
              nodeFilters:
                  - agent:3
            - label: auction/bidder=eli
              nodeFilters:
                  - agent:4
