apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auction
  template:
    metadata:
      labels:
        app: auction
    spec:
      containers:
        - name: auction
          image: auction:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7777
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            #This can be changed 100m is 10% of a code.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auction-service
spec:
  type: ClusterIP
  selector:
    app: auction
  ports:
    - port: 80
      targetPort: 7777
