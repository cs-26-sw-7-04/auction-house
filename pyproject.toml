[project]
name = "auction-house"
version = "0.1.0"
description = "A reverse auction house for compute tasks"
readme = "README.md"
authors = [
    { name = "Tobias-vl", email = "tobias.lauritsen@hotmail.com" },
    { name = "naitsabot", email = "naitsabot@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.156.8",
    "geocoder>=1.38.1",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
k8s = ["kubernetes>=31"]
sim = ["httpx>=0.27"]

[project.scripts]
auction-house = "auction_house.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auction_house"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]


[tool.ruff.lint]
ignore = ["UP017"]
extend-exclude = ["tests"]

[tool.pylint.main]
disable = [
    "fixme",
    "missing-module-docstring",
    "missing-class-docstring",
    #"missing-function-docstring",
    "W0105",
]
ignore-paths = ["^tests/"]
max-line-length=160
